<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>駅のスケジュール</title>
</head>
<body>
    <h1>指定駅のスケジュール</h1>

    <!-- 駅名表示部分 -->
    <div id="stationDisplay">現在の駅: 初期駅名</div>

    <!-- 駅を変更するためのボタンと入力フィールド -->
    <input type="text" id="stationInput" placeholder="新しい駅名を入力" />
    <button id="changeStationButton">指定駅を変更</button>

    <script src="script.js"></script>
</body>
</html>
